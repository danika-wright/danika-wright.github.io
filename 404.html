<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nothing here</title>
<style>
  :root { --bg: #F3F5F9; --ink: #13224A; --muted: #55617E; --gold: #B8964A; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0A1230; --ink: #E7EBF5; --muted: #9DA8C4; --gold: #D5B872; color-scheme: dark; }
  }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0 16px;
    display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font: 17px/1.5 "Helvetica Neue", Arial, sans-serif;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font: 500 34px/1.1 "Didot", "Bodoni 72", Georgia, serif; }
  p { margin: 0; color: var(--muted); }
  .rule { width: 40px; height: 1px; margin: 18px auto; background: var(--gold); }
</style>
</head>
<body>
  <main>
    <h1>Nothing here</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Or nothing here any more. Pages on this site are shared for a while, then taken down.</p>
  </main>
</body>
</html>
